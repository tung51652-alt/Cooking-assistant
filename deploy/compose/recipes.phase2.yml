name: cooklens-recipes-phase2

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      QDRANT__TELEMETRY_DISABLED: 'true'
    volumes:
      - recipe-index:/qdrant/storage
    networks: [recipes]
    healthcheck:
      test: [CMD-SHELL, 'bash -c "exec 3<>/dev/tcp/127.0.0.1/6333"']
      interval: 2s
      timeout: 2s
      retries: 30

  recipe-init:
    image: cooklens-recipes:phase2
    command: [python, -m, ai.rag.ingestion.seed]
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    networks: [recipes]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    healthcheck:
      disable: true

  recipes:
    image: cooklens-recipes:phase2
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      recipe-init:
        condition: service_completed_successfully
    networks: [recipes, browser]
    ports: ['127.0.0.1:8001:8001']
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cpus: 4
    mem_limit: 2g

networks:
  recipes:
    internal: true
  browser:

volumes:
  recipe-index:
