# Explicit development profile only. Never used by the release frontend.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log off;
    client_max_body_size 11m;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8081;
        set $gateway http://backend:8080;
        location / { proxy_pass $gateway; }
    }
    server {
        listen 8000;
        set $vision http://vision:8000;
        location / { proxy_pass $vision; }
    }
    server {
        listen 8001;
        set $recipes http://recipes:8001;
        location / { proxy_pass $recipes; }
    }
    server {
        listen 6333;
        set $qdrant http://qdrant:6333;
        location / { proxy_pass $qdrant; }
    }
}
