worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    etag off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Random request IDs are formatted as UUIDs transiently, never stored in metadata.
    map $request_id $proxy_uuid {
        "~^(.{8})(.{4})(.{4})(.{4})(.{12})$" $1-$2-$3-$4-$5;
    }
    map $http_x_request_id $public_request_id {
        "~*^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $http_x_request_id;
        default $proxy_uuid;
    }
    # A connect timeout has no completed upstream connection; a read timeout does.
    map $upstream_connect_time $connection_failed {
        "" 1;
        "-" 1;
        default 0;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 11m;
        client_body_buffer_size 64k;
        client_body_timeout 15s;
        send_timeout 25s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control no-cache always;

        resolver 127.0.0.11 valid=5s ipv6=off;
        set $gateway http://backend:8080;
        location = /api/recipes/search {
            client_max_body_size 8k;
            include /etc/nginx/cooklens-proxy.conf;
        }
        location /api/ { include /etc/nginx/cooklens-proxy.conf; }
        location = /health/live { default_type application/json; return 200 '{"status":"live"}'; }
        location /assets/ { try_files $uri =404; }
        location /notices/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }

        error_page 413 = @too_large;
        error_page 408 = @receive_timeout;
        error_page 504 = @timeout;
        error_page 502 503 = @unavailable;
        location @too_large {
            default_type application/json;
            add_header X-Request-ID $public_request_id always;
            add_header Cache-Control no-store always;
            return 413 '{"api_version":"1.0.0","request_id":"$public_request_id","code":"UPLOAD_TOO_LARGE","message":"Yêu cầu vượt quá giới hạn dung lượng."}';
        }
        location @timeout {
            default_type application/json;
            add_header X-Request-ID $public_request_id always;
            add_header Cache-Control no-store always;
            if ($connection_failed) {
                return 503 '{"api_version":"1.0.0","request_id":"$public_request_id","code":"DEPENDENCY_NOT_READY","message":"Dịch vụ chưa sẵn sàng, vui lòng thử lại."}';
            }
            return 504 '{"api_version":"1.0.0","request_id":"$public_request_id","code":"DEPENDENCY_TIMEOUT","message":"Dịch vụ phản hồi quá chậm, vui lòng thử lại."}';
        }
        location @receive_timeout {
            default_type application/json;
            add_header X-Request-ID $public_request_id always;
            add_header Cache-Control no-store always;
            return 504 '{"api_version":"1.0.0","request_id":"$public_request_id","code":"DEPENDENCY_TIMEOUT","message":"Dịch vụ phản hồi quá chậm, vui lòng thử lại."}';
        }
        location @unavailable {
            default_type application/json;
            add_header X-Request-ID $public_request_id always;
            add_header Cache-Control no-store always;
            return 503 '{"api_version":"1.0.0","request_id":"$public_request_id","code":"DEPENDENCY_NOT_READY","message":"Dịch vụ chưa sẵn sàng, vui lòng thử lại."}';
        }
    }
}
