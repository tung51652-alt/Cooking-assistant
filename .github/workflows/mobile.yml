name: Mobile Expo
on:
  pull_request:
    paths: ['mobile/**', 'packages/cooklens-api/**', 'frontend/src/generated/**', '.github/workflows/mobile.yml']
  push:
    branches: [feature/mobile-expo, develop, main]
    paths: ['mobile/**', 'packages/cooklens-api/**', 'frontend/src/generated/**', '.github/workflows/mobile.yml']
permissions:
  contents: read
concurrency:
  group: expo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-native-bundles:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python deploy/scripts/check_public_metadata.py
      - run: node --experimental-strip-types --test packages/cooklens-api/client.test.mjs
      - run: npm --prefix mobile ci --ignore-scripts --no-audit --no-fund
      - run: npx expo install --check
        working-directory: mobile
      - run: npm --prefix mobile run typecheck
      - name: Bundle Android and iOS without publishing
        env:
          CI: '1'
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8080/api
        run: |
          npm --prefix mobile run export > "$RUNNER_TEMP/cooklens-mobile-export.log" 2>&1
          echo 'Android and iOS bundles built; native outputs are not published.'
