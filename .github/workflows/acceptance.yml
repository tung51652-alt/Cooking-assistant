name: Phase 7 published image acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Match the fixtures and runtime manifest to the published 2.0.0 images.
          ref: v2.0.0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow
      - run: npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - name: Pull the published candidate
        run: |
          docker compose -f compose.yaml pull
          docker pull nginx:1.30.6-alpine3.24
      - name: Reacquire external evaluation images
        run: |
          mkdir -p /tmp/cooklens-evaluation /tmp/cooklens-acceptance-evidence
          curl --fail --location --retry 3 'https://huggingface.co/datasets/vuongnhathien/30VNFoods/resolve/main/test.zip?download=true' --output /tmp/cooklens-evaluation/test.zip
          curl --fail --location --retry 3 https://raw.githubusercontent.com/pytorch/hub/master/images/dog.jpg --output /tmp/cooklens-evaluation/out-of-domain.jpg
      - name: Fixed clean split with the published CPU vision runtime
        run: |
          docker run --rm --network none --no-healthcheck -e PYTHONPATH=/app -v "$PWD:/acceptance:ro" -v /tmp/cooklens-evaluation:/evaluation:ro trantung2006/cooklens-vision:2.0.0 python /acceptance/deploy/scripts/evaluate_release_vision.py --archive /evaluation/test.zip --manifest /acceptance/data/processed/manifests/30vnfoods_clean_split_manifest.csv > /tmp/cooklens-acceptance-evidence/phase-7-vision.json
      - name: Thirty photo flows, retrieval and real browsers
        run: python deploy/scripts/accept_release_flow.py --archive /tmp/cooklens-evaluation/test.zip --out-of-domain /tmp/cooklens-evaluation/out-of-domain.jpg --report /tmp/cooklens-acceptance-evidence/phase-7-flow.json
      - name: Offline, lifecycle, rollback and warm latency
        run: python deploy/scripts/smoke_release_stack.py --samples 100 --report /tmp/cooklens-acceptance-evidence/phase-7-runtime.json
      - run: python deploy/scripts/check_public_metadata.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-7-technical-evidence
          path: |
            /tmp/cooklens-acceptance-evidence/phase-7-*.json
            /tmp/cooklens-acceptance-evidence/phase-7-ui/
          if-no-files-found: error
