name: Frontend design and real API
on:
  pull_request:
    paths: ['frontend/**', 'backend/**', 'ai/cv/inference/**', 'ai/rag/**', 'data/recipes/**', 'data/processed/**', 'deploy/**', '.dockerignore', '.github/workflows/frontend.yml']
  push:
    branches: [develop, main]
    paths: ['frontend/**', 'backend/**', 'ai/cv/inference/**', 'ai/rag/**', 'data/recipes/**', 'data/processed/**', 'deploy/**', '.dockerignore', '.github/workflows/frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-and-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python deploy/scripts/check_public_metadata.py
      - run: npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix frontend run build
      - run: python deploy/scripts/check_frontend_build.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - name: Stage verified public models
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python deploy/scripts/fetch_vision_checkpoint.py
          python deploy/scripts/fetch_embedding_model.py
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
      - run: python -m pip install -r ai/rag/requirements.txt
      - run: python -m ai.rag.ingestion.bundle --model deploy/artifacts/staging/embedding --output deploy/artifacts/staging/recipes
      - run: docker build -f deploy/docker/Dockerfile.vision -t cooklens-vision:phase1 .
      - run: docker build -f deploy/docker/Dockerfile.recipes -t cooklens-recipes:phase2 .
      - run: docker build -f deploy/docker/Dockerfile.backend -t cooklens-backend:phase3 .
      - run: docker build -f deploy/docker/Dockerfile.frontend -t cooklens-frontend:phase4 .
      - run: docker compose -p cooklens-web-ci -f deploy/compose/recipes.phase2.yml -f deploy/compose/backend.phase3.yml -f deploy/compose/frontend.phase4.yml up -d
      - name: Wait for web and real dependencies
        run: |
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(90):
              try:
                  with urlopen('http://127.0.0.1:5173/api/health',timeout=3) as response:
                      assert response.status == 200
                  break
              except (OSError,AssertionError): time.sleep(.5)
          else: raise RuntimeError('Web stack did not become ready')
          PY
      - name: Desktop and mobile with actual CV and recipes
        env:
          COOKLENS_REAL_API: '1'
          COOKLENS_BASE_URL: http://127.0.0.1:5173
        run: npm --prefix frontend run test:e2e
      - run: python deploy/scripts/smoke_frontend_container.py --project cooklens-web-ci
      - if: always()
        run: docker compose -p cooklens-web-ci -f deploy/compose/recipes.phase2.yml -f deploy/compose/backend.phase3.yml -f deploy/compose/frontend.phase4.yml down --volumes > /dev/null 2>&1 || true
