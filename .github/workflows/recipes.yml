name: Recipes runtime
on:
  pull_request:
    paths: ['ai/rag/**', 'data/recipes/**', 'data/processed/**', 'deploy/**', 'compose.yaml', '.github/workflows/recipes.yml']
  push:
    branches: [develop, main]
    paths: ['ai/rag/**', 'data/recipes/**', 'data/processed/**', 'deploy/**', 'compose.yaml', '.github/workflows/recipes.yml']
permissions:
  contents: read
jobs:
  cpu-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COOKLENS_IMAGE_PREFIX: cooklens
      COOKLENS_IMAGE_TAG: local
      QDRANT_URL: http://127.0.0.1:6333
      RECIPES_BUNDLE_DIR: deploy/artifacts/staging/recipes
      EMBEDDING_MODEL_DIR: deploy/artifacts/staging/embedding
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python deploy/scripts/check_public_metadata.py
      - run: python -m unittest discover -s deploy/tests -v
      - run: python deploy/scripts/fetch_embedding_model.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
      - run: python -m pip install -r ai/rag/requirements.txt
      - run: python -m ai.rag.ingestion.bundle --model "$EMBEDDING_MODEL_DIR" --output "$RECIPES_BUNDLE_DIR"
      - run: docker run -d --name cooklens-recipes-ci-qdrant -p 127.0.0.1:6333:6333 -e QDRANT__TELEMETRY_DISABLED=true qdrant/qdrant:v1.19.2 > /dev/null
      - run: python -m unittest discover -s ai/rag/tests -v
      - run: docker build -f ai/rag/Dockerfile -t cooklens-recipes:local .
      - run: python deploy/scripts/smoke_recipes_container.py
      - run: docker compose -p cooklens-recipes-ci up -d --wait --wait-timeout 240 recipes
      - name: Evaluate the real recipes container without publishing AI ports
        run: |
          python - <<'PYTHON'
          import json, subprocess, sys
          sys.path.insert(0, 'deploy/scripts')
          from recipe_evaluation import evaluate_in_container
          container = subprocess.check_output(['docker', 'compose', '-p', 'cooklens-recipes-ci', 'ps', '-q', 'recipes'], text=True).strip()
          report = evaluate_in_container(container)
          assert report['technical_gate_met']
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PYTHON
      - if: always()
        run: docker rm -f cooklens-recipes-ci-qdrant > /dev/null 2>&1 || true
      - if: always()
        run: docker compose -p cooklens-recipes-ci -f compose.yaml down --volumes > /dev/null 2>&1 || true
