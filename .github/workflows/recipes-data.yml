name: Recipe corpus
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python deploy/scripts/check_public_metadata.py
      - run: python data/recipes/validate.py --require-full-coverage
      - run: python -m unittest discover -s data/tests -v
